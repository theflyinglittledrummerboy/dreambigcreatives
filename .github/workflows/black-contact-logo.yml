name: Black contact logo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/black-contact-logo.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Make contact-section logo black
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('.contact img{width:120px;margin:0 auto 30px;filter:invert(1)}','.contact img{width:120px;margin:0 auto 30px;filter:brightness(0)}',1)
          s=s.replace('.contact img{filter:none;width:96px}', '.contact img{filter:brightness(0);width:96px}',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make contact logo black"
          git push
