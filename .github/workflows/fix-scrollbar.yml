name: Fix scrollbar
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-scrollbar.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Refine scrollbar
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          needle='*{box-sizing:border-box}html{scroll-behavior:smooth}'
          repl='*{box-sizing:border-box}html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#777 #0a0a0a}html::-webkit-scrollbar{width:8px}html::-webkit-scrollbar-track{background:#0a0a0a}html::-webkit-scrollbar-thumb{background:#6f6b65;border-radius:999px;border:2px solid #0a0a0a}html::-webkit-scrollbar-thumb:hover{background:#aaa}'
          if needle not in s: raise SystemExit('CSS anchor not found')
          p.write_text(s.replace(needle,repl,1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine site scrollbar"
          git push
