name: Transparent scrollbar
on:
  push:
    branches: [main]
    paths: ['.github/workflows/transparent-scrollbar.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Make scrollbar track transparent
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#777 #0a0a0a}html::-webkit-scrollbar{width:8px}html::-webkit-scrollbar-track{background:#0a0a0a}html::-webkit-scrollbar-thumb{background:#6f6b65;border-radius:999px;border:2px solid #0a0a0a}html::-webkit-scrollbar-thumb:hover{background:#aaa}'
          new='html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:rgba(110,110,110,.65) transparent}html::-webkit-scrollbar{width:7px;background:transparent}html::-webkit-scrollbar-track{background:transparent}html::-webkit-scrollbar-thumb{background:rgba(110,110,110,.55);border-radius:999px;border:2px solid transparent;background-clip:padding-box}html::-webkit-scrollbar-thumb:hover{background:rgba(150,150,150,.75);background-clip:padding-box}'
          if old not in s: raise SystemExit('Scrollbar CSS not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make scrollbar transparent"
          git push
